[project]
name = "iacforge"
version = "0.1.0"
description = "Provider-neutral infrastructure provisioning for humans, AI agents and code: one YAML spec, rendered to OpenTofu/Terraform or Pulumi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
pulumi = ["pulumi>=3.100"]
pulumi-docker = ["pulumi>=3.100", "pulumi-docker>=4.5"]
pulumi-aws = ["pulumi>=3.100", "pulumi-aws>=6.0"]
pulumi-gcp = ["pulumi>=3.100", "pulumi-gcp>=7.0"]
pulumi-libvirt = ["pulumi>=3.100", "pulumi-libvirt>=0.4"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
iacforge = "iacforge.cli:main"
iacforge-mcp = "iacforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iacforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "tofu: needs the tofu or terraform binary and network access to download providers",
  "pulumi: needs the pulumi CLI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
